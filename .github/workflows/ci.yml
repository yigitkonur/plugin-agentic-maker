name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code (plugin validator)
        run: npm install -g @anthropic-ai/claude-code
      - name: Checks (compile, CLI smoke, lint, links, manifests, validate, hygiene)
        run: scripts/check.sh
